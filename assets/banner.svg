<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hamza Tahir — SAP Consultant and AI Builder. I build clean cores and the intelligence that orbits them.">
  <defs>
    <radialGradient id="bgGlowA" cx="78%" cy="50%" r="55%">
      <stop offset="0" stop-color="#1B90FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#04050A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowB" cx="12%" cy="20%" r="45%">
      <stop offset="0" stop-color="#9B6BFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#04050A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8F1FF"/>
      <stop offset="0.7" stop-color="#BFF8FF"/>
      <stop offset="1" stop-color="#3CF0FF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3CF0FF" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#3CF0FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3CF0FF" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#BFF8FF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#3CF0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1B90FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3CF0FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
      .sans { font-family: "Space Grotesk", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .twinkle { animation: tw 3.2s ease-in-out infinite; }
      .twinkle.b { animation-delay: 1.1s; }
      .twinkle.c { animation-delay: 2.2s; }
      @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      .pulse { animation: pu 1.1s ease-in-out infinite; transform-origin: 930px 160px; }
      @keyframes pu { 0%,100% { opacity: .75; transform: scale(1) } 50% { opacity: 1; transform: scale(1.06) } }
      .blink { animation: bl 1.6s steps(1) infinite; }
      @keyframes bl { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .spin { animation: sp 24s linear infinite; transform-origin: 930px 160px; }
      .spinr { animation: sp 36s linear infinite reverse; transform-origin: 930px 160px; }
      @keyframes sp { to { transform: rotate(360deg) } }
    </style>
  </defs>

  <!-- space -->
  <rect width="1200" height="320" fill="#04050A"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#bgGlowA)"/>
  <rect width="1200" height="320" fill="url(#bgGlowB)"/>

  <!-- stars -->
  <g fill="#E8F1FF">
    <circle cx="610" cy="40" r="1.1" class="twinkle"/><circle cx="680" cy="262" r="1" class="twinkle b"/>
    <circle cx="742" cy="92" r="1.3" class="twinkle c"/><circle cx="1110" cy="58" r="1.2" class="twinkle"/>
    <circle cx="1150" cy="250" r="1" class="twinkle b"/><circle cx="1060" cy="286" r="1.1" class="twinkle c"/>
    <circle cx="560" cy="290" r="0.9" class="twinkle b"/><circle cx="805" cy="300" r="1" class="twinkle"/>
    <circle cx="1170" cy="140" r="0.9" class="twinkle c"/><circle cx="790" cy="30" r="0.8"/>
    <circle cx="845" cy="62" r="0.8" opacity=".6"/><circle cx="1020" cy="36" r="0.9" opacity=".7"/>
    <circle cx="1185" cy="196" r="0.8" opacity=".5"/><circle cx="640" cy="140" r="0.7" opacity=".5"/>
    <circle cx="700" cy="190" r="0.8" opacity=".6"/><circle cx="520" cy="70" r="0.7" opacity=".5"/>
  </g>

  <!-- HUD frame -->
  <g fill="none" stroke="#3CF0FF" stroke-opacity="0.55" stroke-width="1.4">
    <path d="M14 34V14H34"/><path d="M1166 14H1186V34"/><path d="M14 286V306H34"/><path d="M1166 306H1186V286"/>
  </g>
  <line x1="60" y1="14" x2="1140" y2="14" stroke="#3CF0FF" stroke-opacity="0.12"/>

  <!-- top telemetry -->
  <text x="40" y="44" class="mono" font-size="12" letter-spacing="3" fill="#3CF0FF" fill-opacity="0.85">HAMZA.OS v4.0  ·  KHI 24.86°N 67.00°E</text>
  <text x="1160" y="44" class="mono" font-size="12" letter-spacing="3" fill="#9FB3D9" text-anchor="end">[ 01 // IDENTITY ]</text>

  <!-- identity -->
  <text x="40" y="78" class="mono" font-size="13" letter-spacing="3.5" fill="#9FB3D9">SAP CONSULTANT · AI BUILDER</text>
  <text x="38" y="150" class="sans" font-size="72" font-weight="700" letter-spacing="-2" fill="url(#nameFill)">Hamza Tahir</text>
  <text x="40" y="190" class="sans" font-size="21" fill="#E8F1FF" fill-opacity="0.92">I build clean cores — and the intelligence that orbits them.</text>
  <text x="40" y="226" class="mono" font-size="12.5" letter-spacing="2" fill="#3CF0FF" fill-opacity="0.8">S/4HANA · ABAP CLOUD · FIORI/UI5 · BTP · CPI · AI AGENTS</text>
  <g class="mono" font-size="12" letter-spacing="1.5">
    <rect x="40" y="246" width="160" height="26" rx="2" fill="#3CF0FF" fill-opacity="0.06" stroke="#3CF0FF" stroke-opacity="0.35"/>
    <text x="120" y="263" text-anchor="middle" fill="#3CF0FF">4+ YRS · 8 WORLDS</text>
    <rect x="210" y="246" width="190" height="26" rx="2" fill="#4DFFB0" fill-opacity="0.06" stroke="#4DFFB0" stroke-opacity="0.4"/>
    <text x="305" y="263" text-anchor="middle" fill="#4DFFB0">4 GREENFIELD · 3 GROW</text>
    <rect x="410" y="246" width="150" height="26" rx="2" fill="#FFB547" fill-opacity="0.07" stroke="#FFB547" stroke-opacity="0.45"/>
    <text x="485" y="263" text-anchor="middle" fill="#FFB547">SAP IP REGISTERED</text>
  </g>
  <circle cx="579" cy="259" r="4" fill="#4DFFB0" class="blink"/>
  <text x="590" y="263" class="mono" font-size="12" letter-spacing="1.5" fill="#9FB3D9">AI TWIN ONLINE</text>

  <!-- clean core + kepler orbits (T ∝ a^1.5) -->
  <g transform="rotate(-14 930 160)">
    <ellipse cx="930" cy="160" rx="72" ry="26" fill="none" stroke="#3CF0FF" stroke-opacity="0.28"/>
    <ellipse cx="930" cy="160" rx="118" ry="42" fill="none" stroke="#1B90FF" stroke-opacity="0.26"/>
    <ellipse cx="930" cy="160" rx="166" ry="60" fill="none" stroke="#9B6BFF" stroke-opacity="0.22" stroke-dasharray="3 6"/>
    <circle r="5" fill="#2F8BFF" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M858,160 a72,26 0 1,0 144,0 a72,26 0 1,0 -144,0"/>
    </circle>
    <circle r="6" fill="#2FE6C8" filter="url(#glow)">
      <animateMotion dur="12.6s" repeatCount="indefinite" path="M812,160 a118,42 0 1,0 236,0 a118,42 0 1,0 -236,0"/>
    </circle>
    <circle r="4.5" fill="#F5C451" filter="url(#glow)">
      <animateMotion dur="20.9s" repeatCount="indefinite" path="M764,160 a166,60 0 1,0 332,0 a166,60 0 1,0 -332,0"/>
    </circle>
    <circle r="3.5" fill="#FF5FA2" filter="url(#glow)">
      <animateMotion dur="20.9s" begin="-10s" repeatCount="indefinite" path="M764,160 a166,60 0 1,0 332,0 a166,60 0 1,0 -332,0"/>
    </circle>
  </g>
  <circle cx="930" cy="160" r="46" fill="url(#coreGlow)" class="pulse"/>
  <g class="spin" fill="none" stroke="#3CF0FF" stroke-width="1.3" filter="url(#glow)">
    <polygon points="930,128 958,144 958,176 930,192 902,176 902,144" stroke-opacity="0.95"/>
    <path d="M930,128 L930,192 M902,144 L958,176 M958,144 L902,176" stroke-opacity="0.45"/>
  </g>
  <g class="spinr" fill="none" stroke="#3CF0FF" stroke-opacity="0.35">
    <circle cx="930" cy="160" r="58" stroke-dasharray="2 7"/>
  </g>
  <text x="930" y="252" class="mono" font-size="11" letter-spacing="3" fill="#9FB3D9" text-anchor="middle">CLEAN CORE · x = a(cos E − e)</text>

  <!-- scanline -->
  <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 380" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
